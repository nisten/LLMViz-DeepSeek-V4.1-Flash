 renderStorage(){const s=this.state,selected=s.selected&&s.selected.startsWith('cat:')?CATEGORIES.find(c=>'cat:'+c[0]===s.selected):null;return html`<div><div class="inspect-path">PARAMETERS / FORMATS / BYTES</div><h2 class="editorial">Storage, <em>honestly.</em></h2><p class="lede">Mass is conserved as the architecture unfolds. Compare the same logical weights in different formats.</p><div class="storage-total"><small>${MODE_INFO[s.precision].note.toUpperCase()}</small><strong>${bytes(TOTALS[s.precision],s.binary)}</strong><span>Schema-derived tensor payload estimate</span></div>

 <${Section} title="Payload by component" tag=${selected?'SELECTED: '+selected[0].toUpperCase():'ALL MODULES'}>${CATEGORIES.map(([id,name,c,ws])=>{let b=sumB(ws,s.precision),active=selected&&selected[0]===id;return html`<button class=${'category-row'+(active?' active':'')} onClick=${()=>this.patch({selected:'cat:'+id})}><div><i style=${{background:c}}/><span>${name}</span><b>${bytes(b,s.binary)}</b></div><span class="mini-track"><i style=${{width:b/TOTALS[s.precision]*100+'%',background:c}}/></span><small>${fmtP(sumP(ws))} parameters <span>${(b/TOTALS[s.precision]*100).toFixed(2)}%</span></small></button>`;})}<//>
 <${Section} title="Why NVFP4 grows here"><div class="equation"><span>NATIVE</span><code>0.5 + 1/32 = 0.53125 B/p</code><span>NVFP4</span><code>0.5 + 1/16 = 0.56250 B/p</code></div><${Fact} label="Routed expert payload change" value="+5.88%" color=${COL.full}/><${Fact} label="Modeled checkpoint change" value={'+'+bytes(NV_DELTA,s.binary)} color=${COL.full}/><p class="fine">Only 40 backbone expert banks change. Extra per-tensor scaling is estimated at eight bytes per expert matrix. The supplied recipe does not quantize Engram to FP4.</p><//>
 <${Section} title="Audit, rather than guess"><p class="fine">The 510 GB upstream listing is consistent with this estimate, but rounded. Inspect local Safetensors headers for exact stored tensor bytes, including scale tensors. No weights are loaded or uploaded.</p><button class="outline-btn full-width" onClick=${()=>this.patch({modal:'audit'})}><${Icon} name="expand" size=${16}/> Audit local checkpoint headers</button><button class="text-link" onClick=${()=>this.exportLedger()}>Export derived tensor ledger <${Icon} name="download" size=${14}/></button><//>
 <details class="assumptions"><summary>Accounting assumptions and limits</summary><p>Safetensors headers, file padding, unknown extra buffers and exporter-specific metadata are not included. The inventory follows the released config and reference shapes. Some checkpoint dtypes, notably compressor weights, require shard-header confirmation.</p><p>FP8 linears include one byte per 32 x 32 scale block. Engram includes one scale byte per 32 values. Expert banks include packed data and group scales. F32 residual mixing and routing correction tensors remain F32 natively.</p><p>The reference converter expands the FP8 grouped output projection <code>wo_a</code> to BF16; the runtime expands the BF16 output head to F32. Neither expansion is counted as disk storage. Serving buffers, tensor parallelism and GPU allocator overhead are different quantities.</p></details></div>`;}
 renderCache(){const s=this.state,n=s.context,global=n*890;return html`<div><div class="inspect-path">COMPRESSED SPARSE ATTENTION 2</div><h2 class="editorial">One memory.<br/><em>Many readers.</em></h2><p class="lede">Four global KV owners. Eight indexing layers. Forty local sliding windows.</p><div class="storage-total cache-total"><small>GLOBAL CACHE / ORIGINAL TOKEN</small><strong>890 <em>bytes</em></strong><span>Model-wide, not multiplied by 40 layers</span></div>

 <div class="scene-tools"><button class=${'icon-button '+(s.labels?'active':'')} aria-label="Toggle all layer labels" aria-pressed=${s.labels} onClick=${()=>this.patch({labels:!s.labels})} title="Layer labels (L)"><${Icon} name="labels"/></button><button class=${'icon-button '+(s.links?'active':'')} aria-label="Toggle flow paths" aria-pressed=${s.links} onClick=${()=>this.patch({links:!s.links})} title="Flow paths (K)"><${Icon} name="link"/></button><button class="icon-button" aria-label="Reset camera" onClick=${()=>this.engine&&this.engine.reset()} title="Reset view (R)"><${Icon} name="reset"/></button><button class="icon-button" aria-label="Save 3D canvas image" onClick=${()=>this.snapshot()} title="Save canvas image"><${Icon} name="camera"/></button></div>
 <div class="scene-scale"><span class="scale-glyph"/><span>1 cubic unit = 1 GB <em>${s.view==='cache'?'global KV payload':'modeled weight payload'} / ${this.engine&&this.engine.renderer.software?'CPU 3D':'WebGL2'}</em></span></div><div class="scene-legend">${(s.view==='cache'?[['full','Encoder KV'],['dec','Decoder KV']]:s.view==='storage'?[['expert','Experts'],['engram','Engram'],['attn','Attention']]:[['full','Full'],['reindex','Reindex'],['reuse','Reuse'],['swa','SWA only']]).map(([key,l])=>html`<span><i style=${{background:COL[key]}}/>${l}</span>`)}</div>
 ${s.view==='architecture'&&(phaseI===3||s.selected&&s.selected[0]==='D')&&html`<div class="draft-diagram"><div><b>DSPARK / FIVE-TOKEN DRAFT</b><small>Synthetic confidence example</small></div><div class="draft-cells">${[.98,.94,.87,.62,.41].map((confidence,i)=>{let step=(s.time>=16?s.time-16:2),stage=step<1.2?'proposed':step<2.8?'scored':i<3?'accepted':i===3?'corrected':'redraft';return html`<div class=${'draft-cell '+stage}><small>t + ${i+1}</small><b>${step<1.2?'...':confidence.toFixed(2)}</b><span>${stage}</span></div>`;})}</div><p>Token states, not weight volumes. No measured acceptance rate.</p></div>`}
 ${nv&&s.view!=='cache'&&html`<div class="format-notice"><b>+${bytes(NV_DELTA,s.binary)}</b> modeled vs native / smaller scale groups</div>`}${s.error&&html`<div class="graphics-error"><h2>Graphics unavailable</h2><p>${s.error}</p><p>The inspector, configs, benchmarks and byte audit still work. Enable canvas rendering and reload for the 3D scene.</p></div>`}
 </section>
 <footer class="transport"><div class="story-text"><div><span class="story-phase" style=${{color:phase.color}}>0${phaseI+1} / ${phase.name.toUpperCase()}</span><b>${phase.caption}</b></div><span class="story-number" style=${{color:phase.color}}>${phase.active}<small>${phaseI===0||phaseI===2?'ACTIVE / TOKEN':'SCHEMATIC STEP'}</small></span></div><div class="story-description">${phase.desc}</div><div class="transport-row"><button class="play-button" aria-label=${s.playing?'Pause animation':'Play animation'} onClick=${()=>this.patch({playing:!s.playing})}><${Icon} name=${s.playing?'pause':'play'} size=${18}/></button><div class="timeline"><div class="phase-buttons">${PHASES.map((p,i)=>html`<button class=${phaseI===i?'active':''} style=${{'--phase':p.color,flex:p.to-p.from}} onClick=${()=>this.seek(p.from+.01)}>${p.name}</button>`)}</div><input aria-label="Animation timeline" type="range" min="0" max="21.99" step="0.01" value=${s.time} onInput=${e=>this.seek(Number(e.target.value))} style=${{'--progress':s.time/22*100+'%'}}/></div><select class="speed-select" value=${s.speed} aria-label="Animation speed" onChange=${e=>this.patch({speed:Number(e.target.value)})}>${[.5,1,1.5,2].map(v=>html`<option value=${v}>${v}x</option>`)}</select><button class=${'orbit-button '+(s.orbit?'active':'')} aria-label="Toggle camera auto orbit" aria-pressed=${s.orbit} onClick=${()=>this.patch({orbit:!s.orbit})}>Orbit</button></div><div class="transport-bottom"><span>EXPLANATORY TIMELINE / NOT INFERENCE OR LATENCY</span><span>drag orbit / right-drag pan / wheel zoom</span></div></footer>
 </main>${this.renderInspector()}</div>${s.sheet&&html`<div class="sheet-scrim" onClick=${()=>this.patch({sheet:false})}/>`}${this.renderModal()}${s.toast&&html`<div class="toast" role="status">${s.toast}</div>`}</div>`;}
}
render(html`<${App}/>`,document.getElementById('root'));

})();</script>
